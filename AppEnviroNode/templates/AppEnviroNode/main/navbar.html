{% load static %}

<header class="global-nav" role="banner">
  <div class="global-nav-inner">
    <a href="{% url 'app:dashboard' %}" class="global-nav-brand" aria-label="EnviroPlus Home" style="margin-left: 75px;">
      <img src="{% static 'AppEnviroNode/images/logo.png' %}" alt="EnviroPlus Logo" class="global-nav-logo" />
      <span class="global-nav-title">EnviroPlus</span>
    </a>

    <nav class="global-nav-menu" aria-label="Primary Navigation">
      <a href="{% url 'app:dashboard' %}" class="global-nav-link {% if request.path == '/' %}active{% endif %}">Dashboard</a>
      <a href="{% url 'app:realtime' %}" class="global-nav-link {% if 'realtime' in request.path %}active{% endif %}">Real-Time</a>
      <a href="{% url 'app:map' %}" class="global-nav-link {% if 'map' in request.path %}active{% endif %}">Map</a>
      <a href="{% url 'app:health' %}" class="global-nav-link {% if 'health' in request.path %}active{% endif %}">Health</a>
      <a href="{% url 'app:about' %}" class="global-nav-link {% if 'about' in request.path %}active{% endif %}">About</a>
    </nav>

    <form id="locationSearchForm" class="global-nav-search" method="get" action="" onsubmit="return submitLocationSearch();">
      <input id="locationSearchInput" name="location" type="search" class="search-input" placeholder="Search location" aria-label="Search location" autocomplete="off" />
      <button id="locationSearchBtn" type="submit" class="search-btn">Find</button>
    </form>
  </div>
</header>

  <!-- AI Modal -->
  <div class="modal-overlay" id="aiModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">
          <i class="fa-solid fa-sparkles" style="color: #a855f7; margin-right: 6px;"></i>
          EnviroAI Analysis
        </h2>
        <button type="button" class="modal-close" onclick="closeAIModal()" aria-label="Close modal">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>
      <div id="aiModalContent" class="ai-content-box">
        <!-- Content populated dynamically -->
      </div>
    </div>
  </div>

  <!-- AI Chat Overlay -->
  <div class="ai-chat-launcher-wrapper">
    <button id="aiGifLauncher" class="ai-gif-launcher" type="button" aria-label="Open EnviroPlus AI chat" title="EnviroPlus AI" onclick="openAIModal('chat'); hideAIGifLauncher();">
      <img src="{% static 'AppEnviroNode/images/download.gif' %}" alt="EnviroPlus AI chat launcher" />
    </button>
  </div>

  <div class="ai-chat-overlay" id="aiChatOverlay" aria-hidden="true">
    <div class="ai-chat-card">
      <header class="ai-chat-header">
        <div>
          <div class="ai-chat-title"><i class="fa-solid fa-robot"></i> EnviroAI</div>
          <div class="ai-chat-status"><span class="status-dot"></span> Online</div>
        </div>
        <button type="button" class="chat-close" onclick="closeAIChat()" aria-label="Close chat">
          <i class="fa-solid fa-times"></i>
        </button>
      </header>
      <div class="ai-chat-body" id="aiChatBody">
        <div class="chat-message ai">
          <div class="chat-label"><i class="fa-solid fa-brain"></i> EnviroPlus AI</div>
          <p>Hello! I'm your EnviroAI assistant. Ask me about air quality or health recommendations anytime.</p>
        </div>
      </div>
      <footer class="ai-chat-footer">
        <input id="aiChatInput" class="chat-input" type="text" placeholder="Ask EnviroAI a question..." autocomplete="off" />
        <button id="aiChatSend" class="chat-send" type="button" aria-label="Send message">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </footer>
    </div>
  </div>

  <style>
     /* AI Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1007;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: white;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }

    .modal-title {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      color: #1a3352;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.3rem;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .modal-close:hover {
      background: #f1f5f9;
      color: #1a3352;
    }

    .ai-content-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .ai-chat-overlay {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 1010;
      width: min(320px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      display: none;
      align-items: flex-end;
      justify-content: flex-end;
      pointer-events: none;
    }

    .ai-chat-overlay.active {
      display: flex;
      pointer-events: auto;
    }

    .ai-chat-card {
      width: 100%;
      max-width: 320px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.18);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 420px;
      min-height: 420px;
      max-height: 420px;
    }

    .ai-chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .ai-chat-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f172a;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .ai-chat-status {
      font-size: 0.8rem;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-close {
      background: none;
      border: none;
      color: #64748b;
      font-size: 1rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
    }

    .chat-close:hover {
      background: #f1f5f9;
      color: #1f2937;
    }

    .ai-chat-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      overflow-y: auto;
      background: #eef2ff;
    }

    .chat-message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 100%;
      word-break: break-word;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .chat-message.ai {
      align-self: flex-start;
      padding: 12px 14px;
      border-radius: 18px;
      background: #ffffff;
      border: 1px solid #dbeafe;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    }

    .chat-message.user {
      align-self: flex-end;
      padding: 12px 14px;
      border-radius: 18px;
      background: #2563eb;
      color: #ffffff;
    }

    .chat-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #475569;
    }

    .chat-message.user .chat-label {
      color: #dbeafe;
    }

    .ai-chat-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 12px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
    }

    .ai-chat-footer {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 16px 16px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
    }

    .ai-chat-overlay .chat-input {
      width: 100%;
      min-height: 42px;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #f8fafc;
      padding: 0 16px;
    }

    .ai-chat-overlay .chat-send {
      width: 42px;
      height: 42px;
    }

    .ai-chat-overlay .suggestion-chip {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #334155;
    }

    .ai-chat-overlay .suggestion-chip:hover {
      background: #eff6ff;
    }

    .ai-gif-launcher {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 1015;
      width: auto;
      height: auto;
      border: none;
      padding: 0;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ai-gif-launcher img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      display: block;
      border-radius: 0;
    }

    .ai-gif-launcher:hover {
      transform: translateY(-2px);
    }

    .ai-gif-launcher.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }

    @media (max-width: 640px) {
      .ai-chat-overlay {
        right: 12px;
        bottom: 12px;
        width: calc(100vw - 24px);
      }

      .ai-chat-card {
        min-height: 360px;
      }
    }

    .ai-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #64748b;
      text-align: center;
      padding: 40px 20px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #1769ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .ai-response h3 {
      margin: 0 0 12px 0;
      color: #1a3352;
      font-size: 1rem;
    }

    .ai-response p,
    .ai-response ul,
    .ai-response ol {
      margin: 8px 0;
      font-size: 0.9rem;
      color: #475569;
      line-height: 1.6;
    }

    .ai-response ul,
    .ai-response ol {
      padding-left: 20px;
    }

    .ai-response li {
      margin: 6px 0;
    }

    @media (max-width: 768px) {
      .alert-drawer {
        width: 100%;
        right: -100%;
        top: 56px;
        height: calc(100vh - 56px);
      }

      .modal-card {
        width: 95%;
        max-height: 90vh;
      }
    }

    .search-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.42);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1100;
      padding: 20px;
    }

    .search-modal-overlay.active {
      display: flex;
    }

    .search-modal-card {
      width: min(520px, 100%);
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    .search-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
    }

    .search-modal-header h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
    }

    .search-modal-close {
      background: none;
      border: none;
      color: #64748b;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .search-modal-body {
      padding: 20px;
      color: #334155;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .search-banner {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      border-radius: 0 0 16px 16px;
      z-index: 1101;
      display: none;
      align-items: center;
      justify-content: space-between;
      width: min(100%, 760px);
      max-width: 760px;
      padding: 12px 16px;
      gap: 12px;
    }

    .search-banner.active {
      display: flex;
    }

    .search-banner-text {
      flex: 1;
      font-size: 0.95rem;
    }

    .search-banner-close {
      background: none;
      border: none;
      color: #1d4ed8;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .search-highlight {
      transition: background-color 0.25s ease, border-color 0.25s ease;
      background-color: rgba(253, 224, 71, 0.18) !important;
      border: 1px solid rgba(245, 158, 11, 0.35) !important;
      box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.22);
      border-radius: 14px;
    }

    .search-map-results {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .search-map-results-header {
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
    }

    .search-map-match {
      padding: 14px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #ffffff;
      color: #334155;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .search-map-title {
      font-weight: 700;
      font-size: 0.96rem;
    }

    .search-map-subtitle,
    .search-map-meta {
      font-size: 0.9rem;
      color: #64748b;
    }
  </style>
  <script src="{% static 'AppEnviroNode/js/global-search.js' %}"></script>
