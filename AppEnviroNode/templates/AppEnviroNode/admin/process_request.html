{% extends 'AppEnviroNode/Index.html' %}
{% load static %}

{% block content %}
<style>
  /* Increased max-width to 850px to accommodate a wider layout */
  .process-container { max-width: 850px; margin: 60px auto; padding: 0 20px; font-family: inherit; }
  .process-card { background: white; border-radius: 14px; padding: 40px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.1); border: 1px solid #e2e8f0; }
  .process-card h2 { margin-top: 0; color: #0f172a; font-size: 1.6rem; }
  .process-card p { color: #64748b; font-size: 0.95rem; margin-bottom: 30px; }
  
  /* Added CSS Grid to place inputs side-by-side */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #334155; font-size: 0.9rem; }
  .form-input { width: 100%; padding: 14px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1rem; box-sizing: border-box; font-family: inherit; }
  
  .locked-input { background-color: #f1f5f9; color: #475569; border-color: #e2e8f0; pointer-events: none; }
  
  .btn-submit { width: 100%; padding: 15px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
  .btn-submit:hover { background: #1d4ed8; }
  .btn-cancel { display: block; text-align: center; margin-top: 20px; color: #64748b; text-decoration: none; font-weight: 600; }
  .btn-cancel:hover { color: #0f172a; }

  /* Ensure it stacks vertically on small mobile screens */
  @media (max-width: 768px) {
    .form-row { grid-template-columns: 1fr; gap: 0; }
  }
</style>

<div class="process-container">
  <div class="process-card">
    <h2><i class="fa-solid fa-clipboard-check" style="color: #2563eb;"></i> Process Requested Order</h2>
    <p>Convert <strong>{{ req.customer_name }}'s</strong> request into a tracked inventory order. An automated payment link will be sent to their email.</p>
    
    <form method="POST" action="">
      {% csrf_token %}
      
      <!-- First Row: Name and Email -->
      <div class="form-row">
        <div class="form-group">
          <label>Client / Organization Name</label>
          <input type="text" value="{{ req.customer_name }}" class="form-input locked-input" readonly>
        </div>

        <div class="form-group">
          <label>Contact Email</label>
          <input type="text" value="{{ req.customer_email }}" class="form-input locked-input" readonly>
        </div>
      </div>

      <!-- Second Row: Quantity and Hardware -->
      <div class="form-row">
        <div class="form-group">
          <label>Requested Quantity</label>
          <input type="number" name="quantity" value="{{ parsed_qty }}" class="form-input locked-input" readonly>
        </div>

        <div class="form-group">
          <label>Hardware Variant</label>
          <select name="product_id" class="form-input {% if detected_product_id %}locked-input{% endif %}" {% if detected_product_id %}readonly tabindex="-1"{% endif %} required>
            <option value="" disabled {% if not detected_product_id %}selected{% endif %}>Select hardware configuration...</option>
            {% for product in products %}
              <option value="{{ product.id }}" {% if product.id == detected_product_id %}selected{% endif %}>{{ product.name }} (₱{{ product.price }})</option>
            {% endfor %}
          </select>
        </div>
      </div>
      
      <button type="submit" class="btn-submit">Create Order & Email Client</button>
      <a href="{% url 'app:hardware_inventory' %}" class="btn-cancel">Cancel and Return</a>
    </form>
  </div>
</div>
{% endblock %}
