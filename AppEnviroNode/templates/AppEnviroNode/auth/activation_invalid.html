{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activation Invalid - EnviroPlus</title>
  <link rel="icon" type="image/png" href="{% static 'AppEnviroNode/images/logo.png' %}">
  <link rel="stylesheet" href="{% static 'AppEnviroNode/css/Style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(rgba(11, 17, 32, 0.65), rgba(11, 17, 32, 0.65)), url("../images/pembo.jpg");
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .auth-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      backdrop-filter: blur(3px);
      pointer-events: none;
    }

    .auth-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(11, 17, 32, 0.3);
      width: 100%;
      max-width: 420px;
      padding: 40px;
      text-align: center;
      position: relative;
      z-index: 1;
      border: 2px solid rgba(45, 91, 190, 0.1);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .auth-card:hover {
      box-shadow: 0 25px 80px rgba(45, 91, 190, 0.2);
      transform: translateY(-4px);
    }

    .auth-header {
      margin-bottom: 25px;
    }

    .auth-header h1 {
      font-size: 2rem;
      color: #0B1120;
      margin: 0 0 10px;
      font-weight: 700;
    }

    .auth-header p {
      color: #546a86;
      font-size: 0.95rem;
      margin: 0;
    }

    .error-icon {
      color: #dc2626; 
      font-size: 3.5rem;
      margin-bottom: 20px;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .message-content {
      margin-bottom: 30px;
    }

    .message-content p.primary-msg {
      font-size: 1.05rem;
      color: #113460;
      font-weight: 600;
      margin: 0 0 10px 0;
    }

    .message-content p.secondary-msg {
      font-size: 0.9rem;
      color: #546a86;
      margin: 0;
      line-height: 1.5;
    }

    .action-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #2d5bbe;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    .action-btn:hover {
      background: #1f3f89;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(45, 91, 190, 0.3);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      .auth-card {
        padding: 30px 20px;
      }

      .auth-header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      
      <div class="auth-header">
        <h1>EnviroPlus</h1>
        <p>System Access Portal</p>
      </div>

      <div class="error-icon">
        <i class="fas fa-exclamation-circle"></i>
      </div>

      <div class="message-content">
        <p class="primary-msg">{{ message|default:"Activation Link Invalid" }}</p>
        <p class="secondary-msg">Please request a new invitation from your administrator or contact support to proceed.</p>
      </div>

      <a href="{% url 'app:login' %}" class="action-btn">
        Return to Login
      </a>
      
    </div>
  </div>
</body>
</html>
