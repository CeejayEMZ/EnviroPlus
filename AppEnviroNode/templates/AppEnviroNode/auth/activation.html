{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activate Your Account - EnviroNode</title>
  <link rel="icon" type="image/png" href="{% static 'AppEnviroNode/images/logo.png' %}">
  <link rel="stylesheet" href="{% static 'AppEnviroNode/css/Style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(rgba(11, 17, 32, 0.65), rgba(11, 17, 32, 0.65)), url("../images/pembo.jpg");
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .auth-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      backdrop-filter: blur(3px);
      pointer-events: none;
    }

    .auth-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(11, 17, 32, 0.3);
      width: 100%;
      max-width: 420px;
      padding: 40px;
      position: relative;
      z-index: 1;
      border: 2px solid rgba(45, 91, 190, 0.1);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .auth-card:hover {
      box-shadow: 0 25px 80px rgba(45, 91, 190, 0.2);
      transform: translateY(-4px);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-header h1 {
      font-size: 2rem;
      color: #0B1120;
      margin: 0 0 10px;
      font-weight: 700;
    }

    .auth-header p {
      color: #546a86;
      font-size: 0.95rem;
      margin: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #0B1120;
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px;
      padding-right: 40px; 
      border: 2px solid #e0e7ff;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: inherit;
      box-sizing: border-box;
    }

    .form-group input:hover {
      border-color: #2d5bbe;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2d5bbe;
      box-shadow: 0 0 0 4px rgba(45, 91, 190, 0.15);
      transform: translateY(-2px);
    }

    .form-group input::placeholder {
      color: #889ab5;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #2d5bbe;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #1f3f89;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(45, 91, 190, 0.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .divider {
      text-align: center;
      margin: 25px 0;
      position: relative;
      color: #889ab5;
      font-size: 0.9rem;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #d0d5e3;
    }

    .divider span {
      background: white;
      padding: 0 10px;
      position: relative;
    }

    .signup-link {
      text-align: center;
      font-size: 0.9rem;
      color: #546a86;
    }

    .signup-link a {
      color: #2d5bbe;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .signup-link a:hover {
      color: #1f3f89;
      text-decoration: underline;
    }

    .messages {
      margin-bottom: 20px;
    }

    .message {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .message.success {
      background: #c6f6d5;
      color: #22543d;
      border: 1px solid #9ae6b4;
    }

    .message.error {
      background: #fed7d7;
      color: #742a2a;
      border: 1px solid #fc8181;
    }

    .message.info {
      background: #bee3f8;
      color: #2c5282;
      border: 1px solid #90cdf4;
    }

    @media (max-width: 600px) {
      .auth-card {
        padding: 30px 20px;
      }

      .auth-header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      
      <div class="auth-header">
        <h1>Welcome, {{ user.first_name }}! 👋</h1>
        <p>Secure your credentials to activate your account.</p>
      </div>

      {% if messages %}
        <div class="messages">
          {% for message in messages %}
            <div class="message {{ message.tags|default:'info' }}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="form-group">
          <label for="password">Create Password</label>
          <div style="position: relative;">
            <input 
                type="password" 
                id="password" 
                name="password" 
                required 
                minlength="8"
                placeholder="Min. 8 characters"
            />
            <button 
              type="button" 
              class="password-toggle" 
              style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #889ab5; font-size: 1rem;"
              onclick="togglePasswordVisibility(this)"
              title="Show/hide password"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="password_confirm">Confirm Password</label>
          <div style="position: relative;">
            <input 
                type="password" 
                id="password_confirm" 
                name="password_confirm" 
                required 
                minlength="8"
                placeholder="Confirm your password"
            />
            <button 
              type="button" 
              class="password-toggle" 
              style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #889ab5; font-size: 1rem;"
              onclick="togglePasswordVisibility(this)"
              title="Show/hide password"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">Confirm & Activate Account</button>
      </form>

      <div class="divider">
        <span>Already have an active account?</span>
      </div>

      <div class="signup-link">
        <a href="{% url 'app:login' %}">Log in here</a>
      </div>
      
    </div>
  </div>
  
  <script>
    function togglePasswordVisibility(button) {
      const input = button.parentElement.querySelector('input[type="password"], input[type="text"]');
      if (!input) return;
      
      if (input.type === 'password') {
        input.type = 'text';
        button.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
        button.title = 'Hide password';
      } else {
        input.type = 'password';
        button.innerHTML = '<i class="fa-solid fa-eye"></i>';
        button.title = 'Show password';
      }
    }
  </script>
</body>
</html>
